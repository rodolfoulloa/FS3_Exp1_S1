spring.application.name=biblioteca
server.port=8080

# ===== Conexión a Oracle Autonomous Database (Oracle Cloud) =====
# Los valores se leen desde variables de entorno para no subir credenciales a GitHub.
#   DB_SERVICE : nombre del servicio del wallet (ej: biblioteca_tp, ver tnsnames.ora)
#   TNS_ADMIN  : ruta a la carpeta descomprimida del wallet
#   DB_USER    : usuario de la BD
#   DB_PASSWORD: clave del usuario
spring.datasource.url=jdbc:oracle:thin:@${DB_SERVICE:biblioteca_tp}?TNS_ADMIN=${TNS_ADMIN:./wallet}
spring.datasource.username=${DB_USER:ADMIN}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# ===== JPA / Hibernate =====
# update: crea/actualiza la tabla LIBROS automáticamente si no existe
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
