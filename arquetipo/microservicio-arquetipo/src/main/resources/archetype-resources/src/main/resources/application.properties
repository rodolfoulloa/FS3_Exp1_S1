#set( $symbol_pound = '#' )
#set( $symbol_dollar = '$' )
#set( $symbol_escape = '\' )
spring.application.name=${artifactId}
server.port=8080

${symbol_pound} ===== Conexión a Oracle Autonomous Database (Oracle Cloud) =====
${symbol_pound} Los valores se leen desde variables de entorno para no subir credenciales a Git.
${symbol_pound}   DB_SERVICE : nombre del servicio del wallet (ver tnsnames.ora, ej: fs3db_tp)
${symbol_pound}   TNS_ADMIN  : ruta a la carpeta descomprimida del wallet
${symbol_pound}   DB_USER    : usuario de la BD
${symbol_pound}   DB_PASSWORD: clave del usuario
${symbol_pound} Alternativa: crear application-local.properties (no se sube) y ejecutar con el perfil "local".
spring.datasource.url=jdbc:oracle:thin:@${symbol_dollar}{DB_SERVICE:fs3db_tp}?TNS_ADMIN=${symbol_dollar}{TNS_ADMIN:./wallet}
spring.datasource.username=${symbol_dollar}{DB_USER:ADMIN}
spring.datasource.password=${symbol_dollar}{DB_PASSWORD:}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

${symbol_pound} ===== JPA / Hibernate =====
${symbol_pound} update: crea/actualiza la tabla automáticamente si no existe
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
