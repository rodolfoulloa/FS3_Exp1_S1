server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Las llamadas a /api/** se reenvían al microservicio (contenedor "backend").
    # La barra final de proxy_pass quita el prefijo: /api/libros/1 -> /libros/1
    # Front y API quedan en el mismo origen, por eso no se necesita CORS.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Fallback de SPA: cualquier ruta de Angular (/libros/1/editar) carga index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
