<nav class="navbar navbar-expand navbar-biblioteca">
  <div class="container">
    <h1 class="navbar-brand">
      <a routerLink="/libros" class="text-reset text-decoration-none">
        <i class="bi bi-book-half me-2" aria-hidden="true"></i>Biblioteca
      </a>
    </h1>
    <ul class="navbar-nav gap-1">
      <li class="nav-item">
        <a class="nav-link" routerLink="/libros" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" title="Catálogo">
          <i class="bi bi-collection me-sm-1" aria-hidden="true"></i><span class="d-none d-sm-inline">Catálogo</span>
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" routerLink="/libros/nuevo" routerLinkActive="active" title="Nuevo libro">
          <i class="bi bi-plus-circle me-sm-1" aria-hidden="true"></i><span class="d-none d-sm-inline">Nuevo libro</span>
        </a>
      </li>
    </ul>
  </div>
</nav>

<main class="container py-4 py-lg-5">
  @if (facade.error$ | async; as error) {
    <div class="alert alert-danger alert-dismissible d-flex align-items-center gap-2 shadow-sm" role="alert">
      <i class="bi bi-exclamation-triangle-fill" aria-hidden="true"></i>
      <span>{{ error }}</span>
      <button type="button" class="btn-close" aria-label="Cerrar" (click)="facade.limpiarError()"></button>
    </div>
  }
  <router-outlet />
</main>

<footer class="pie py-3">
  <div class="container d-flex flex-wrap justify-content-between gap-2">
    <span><strong>Biblioteca</strong> · Gestión de libros</span>
    <span>DSY2205 Desarrollo Full Stack III · Angular + Spring Boot + Oracle</span>
  </div>
</footer>
