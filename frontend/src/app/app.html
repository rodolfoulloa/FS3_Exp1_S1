<header class="barra">
  <div class="contenedor barra-contenido">
    <h1><a routerLink="/libros">📚 Biblioteca</a></h1>
    <nav>
      <a routerLink="/libros" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">Libros</a>
      <a routerLink="/libros/nuevo" routerLinkActive="activo">Nuevo libro</a>
    </nav>
  </div>
</header>

<main class="contenedor">
  @if (facade.error$ | async; as error) {
    <div class="alerta" role="alert">
      <span>{{ error }}</span>
      <button type="button" aria-label="Cerrar" (click)="facade.limpiarError()">×</button>
    </div>
  }
  <router-outlet />
</main>

<footer class="pie">DSY2205 Desarrollo Full Stack III · Semana 3 · Angular + microservicio Spring Boot</footer>
